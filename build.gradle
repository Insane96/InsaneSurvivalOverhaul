plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = "${mod_version}"
group = 'insane96mcp.iguanatweaksreborn'

base {
    archivesName = 'InsaneSurvivalOverhaul'
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

jarJar.enable()
minecraft {
    mappings channel: 'parchment', version: "${parchment_version}-${mc_version}"

    copyIdeResources = true

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            workingDirectory project.file('run')
            property 'mixin.debug.export', 'true'
        }

        server {
            workingDirectory project.file('run-server')
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

mixin {
    add sourceSets.main, "mixins.iguanatweaksreborn.refmap.json"
    config "mixins.iguanatweaksreborn.json"
}

repositories {
    flatDir {
        dir 'libs'
    }
    maven {
        url 'https://cursemaven.com'
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url 'https://www.dogforce-games.com/maven/'
        content {
            includeGroup "dev.gigaherz.sewingkit"
        }
    }
    maven {
        url = "https://jitpack.io"
        content {
            includeGroup "com.github.Virtuoel"
        }
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven { url 'https://maven.blamejared.com' }
    maven { url 'https://maven.minecraftforge.net/' }
    maven { url "https://maven.ryanliptak.com/" }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"

    implementation fg.deobf("blank:InsaneLib:${lib_version}-mc${mc_version}")
    implementation fg.deobf("blank:Stamina:1.1.1")
    runtimeOnly fg.deobf("blank:MobsPropertiesRandomness:${mpr_version}-mc${mc_version}")
    implementation fg.deobf("blank:EnhancedAI:${enhancedai_version}-mc${mc_version}")
    implementation fg.deobf("blank:Shields+:${shieldsplus_version}-mc${mc_version}")
    compileOnly fg.deobf("blank:nohunger:1.0.1:slim")

    implementation fg.deobf("curse.maven:selene-499980:5254462")
    runtimeOnly fg.deobf("curse.maven:mmmmmmmmmmmm-225738:5051316")
    runtimeOnly fg.deobf("curse.maven:better-advancements-272515:4631253")
    // runtimeOnly fg.deobf("curse.maven:worldedit-225608:4586218")
    implementation fg.deobf("curse.maven:supplementaries-412082:5225134")

    implementation fg.deobf("com.github.glitchfiend:GlitchCore-forge:${mc_version}-${glitchcore_version}")
    implementation fg.deobf("com.github.glitchfiend:SereneSeasons-forge:${mc_version}-${sereneseasons_version}")
    implementation fg.deobf("curse.maven:time-control-303570:5095704")

    compileOnly fg.deobf("curse.maven:tool-belt-260262:5929061")
    //Needed for data gen
    runtimeOnly fg.deobf("dev.gigaherz.sewingkit:SewingKit-${mc_version}:1.8.0")

    compileOnly fg.deobf("curse.maven:global-gamerules-227657:4587490")

    compileOnly fg.deobf("dev.emi:emi-forge:${emi_version}:api")
    runtimeOnly fg.deobf("dev.emi:emi-forge:${emi_version}")
    implementation fg.deobf("curse.maven:jei-238222:5101366")

    implementation fg.deobf("com.github.Virtuoel:Pehkui:${pehkui_version}-${mc_version}-forge")

    runtimeOnly fg.deobf("net.darkhax.maxhealthfix:MaxHealthFix-Forge-${mc_version}:${max_health_fix_version}")

    //runtimeOnly fg.deobf("curse.maven:corail-woodcutter-331983:4685515")

    //implementation fg.deobf("curse.maven:puzzles-lib-495476:4660882")
    //runtimeOnly fg.deobf("curse.maven:easy-magic-456239:4658750")
    implementation fg.deobf("curse.maven:blueprint-382216:5292242")
    implementation fg.deobf("curse.maven:caverns-and-chasms-438005:6040957")
    compileOnly fg.deobf("curse.maven:autumnity-365045:5229021")
    compileOnly fg.deobf("curse.maven:environmental-388992:6060255")
    compileOnly fg.deobf("curse.maven:berry-good-355589:5228437")
    compileOnly fg.deobf("curse.maven:allurement-438003:5228059")
    compileOnly fg.deobf("curse.maven:farmers-delight-398521:5051242")

    compileOnly fg.deobf("curse.maven:zeta-968868:5418213")
    compileOnly fg.deobf("curse.maven:quark-243121:5418252")

    implementation fg.deobf("squeek.appleskin:appleskin-forge:mc${mc_version}-${apple_skin_version}")

    implementation fg.deobf("curse.maven:villager-comfort-updated-1082700:5622213")

    //implementation fg.deobf("curse.maven:nostalgic-tweaks-592465:5602576")
    //implementation fg.deobf("curse.maven:architectury-api-419699:5137938")

    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"

    minecraftLibrary 'com.ezylang:EvalEx:3.4.0'
    jarJar(group: 'com.ezylang', name: 'EvalEx', version: '[3.0,4.0)')

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0-beta.5"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.0-beta.5")) {
        jarJar.ranged(it, "[0.5.0-beta.5,)")
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : "iguanatweaksreborn",
                "Specification-Vendor"    : "Insane96MCP",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "Insane96MCP",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
    archiveClassifier = 'slim'
}

tasks.named('jarJar') {
    archiveClassifier = ''
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}