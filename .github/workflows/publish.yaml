name: Publish to GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release 标签（例如 v1.2.3）'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Release 名称（留空则自动使用标签名）'
        required: false
        default: ''
      draft:
        description: '是否为草稿（true / false）'
        required: false
        default: false
      prerelease:
        description: '是否为预发布（true / false）'
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 必须授予写入权限，才能创建 Release 和上传附件

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v2
        with:
          distribution: "temurin"
          java-version: 17

      - name: Make Gradle Wrapper Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build

      # 删除可能存在的 slim 版本（避免上传多余文件）
      - name: Remove slim variant
        run: rm -f build/libs/*-slim.jar

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_name }}
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true   # 自动生成 Release 说明（基于 commit 历史）
          files: |
            build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
